<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalidasan Torrent Play</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-box {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff2a55;
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        p {
            color: #a1a1aa;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .label-title {
            font-size: 13px;
            color: #e4e4e7;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            background-color: #09090b;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            border-color: #ff2a55;
        }
        .btn-play {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #ff2a55, #ff5e3a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-play:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="card-box">
        <h1>Kalidasan Torrent</h1>
        <p>Instant Cloud Streamer</p>

        <label class="label-title">🔗 Magnet Link-ஐ இங்கே Paste செய்யவும்:</label>
        <input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:...">
        
        <button class="btn-play" onclick="playCloud()">⚡ Fast Play in Cloud</button>
    </div>

    <script>
        function playCloud() {
            const magnet = document.getElementById('magnetInput').value.trim();
            if (!magnet || !magnet.startsWith('magnet:?')) {
                alert("தயவுசெய்து சரியான Magnet Link-ஐ உள்ளிடவும்!");
                return;
            }

            // Webtor அதிகாரப்பூர்வ கிளவுட் பிளேயருக்கு நேரடியாகத் திருப்புதல் (No Embedding Error)
            const webtorUrl = `https://webtor.io/#/${encodeURIComponent(magnet)}`;
            window.location.href = webtorUrl;
        }
    </script>

</body>
</html>
