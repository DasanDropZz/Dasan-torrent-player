<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalidasan Torrent Play</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #09090b;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 12px 0 18px;
            border-bottom: 1px solid #27272a;
        }
        .header h1 {
            color: #ff2a55;
            font-size: 22px;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header p {
            color: #a1a1aa;
            font-size: 12px;
            margin: 4px 0 0;
        }
        .card-box {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 15px;
            margin-top: 16px;
        }
        .label-title {
            font-size: 13px;
            color: #e4e4e7;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            background-color: #09090b;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        input[type="text"]:focus {
            border-color: #ff2a55;
        }
        .btn-play {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #ff2a55, #ff5e3a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #player-box {
            margin-top: 18px;
            width: 100%;
            min-height: 350px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #27272a;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Kalidasan Torrent Play</h1>
        <p>Cloud Streamer (All Formats Support)</p>
    </div>

    <div class="card-box">
        <label class="label-title">🔗 Magnet Link-ஐ இங்கே Paste செய்யவும்:</label>
        <input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:...">
        <button class="btn-play" onclick="streamNow()">⚡ Fast Play Video</button>
    </div>

    <div id="player-box">
        <div id="player" class="webtor"></div>
    </div>

    <script>
        function streamNow() {
            const magnet = document.getElementById('magnetInput').value.trim();
            if (!magnet || !magnet.startsWith('magnet:?')) {
                alert("தயவுசெய்து சரியான Magnet Link-ஐ உள்ளிடவும்!");
                return;
            }

            const playerBox = document.getElementById('player-box');
            const playerDiv = document.getElementById('player');
            
            playerBox.style.display = 'block';
            playerDiv.innerHTML = '';

            window.webtor = window.webtor || [];
            window.webtor.push({
                id: 'player',
                magnet: magnet,
                width: '100%',
                lang: 'en',
                features: {
                    continue: false,
                    title: true,
                    subtitles: true,
                    settings: true,
                    fullscreen: true,
                    download: true
                }
            });

            if (!document.getElementById('webtor-sdk')) {
                const script = document.createElement('script');
                script.id = 'webtor-sdk';
                script.src = 'https://cdn.jsdelivr.net/npm/@webtor/embed-sdk-js/dist/index.min.js';
                script.async = true;
                document.body.appendChild(script);
            }
        }
    </script>

</body>
</html>
